name: Scala CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  java21:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21
    - name: Set up SBT
      uses: sbt/setup-sbt@v1.1.8
    - name: Run tests
      run: sbt scalafmtSbtCheck scalafmtCheckAll +testOnly
