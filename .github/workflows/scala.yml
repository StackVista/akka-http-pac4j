name: Scala CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  java11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 11
      - name: Set up SBT
        uses: ./.github/actions/setup-sbt
      - name: Run tests
        run: sbt scalafmtSbtCheck scalafmtCheckAll +testOnly
